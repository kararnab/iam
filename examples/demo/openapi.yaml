openapi: 3.0.3
info:
  title: iam demo — books API
  version: 0.1.0
  description: |
    Demo application for github.com/kararnab/iam/v2.

    Two ways to authenticate:

    * **Cookie sessions** (browsers): `POST /api/session/login` sets an
      HttpOnly `session` cookie (`__Host-session` over HTTPS) and returns a
      `csrf_token`. Send it in the `X-CSRF-Token` header on every POST, PUT
      and DELETE.
    * **Bearer tokens** (API clients): `POST /api/login` returns an access
      token (10 minutes) and a refresh token. `POST /api/refresh` rotates the
      refresh token; reusing an old one revokes the session.

    Sign-up is invite-only unless the server runs with `IAM_SIGNUP=open`.

    Roles: `admin` (everything), `editor` (read and write books), `reader`
    (read books).
servers:
  - url: http://localhost:8080

tags:
  - name: bearer
    description: Token-based authentication for API clients
  - name: cookie
    description: Cookie sessions for browsers
  - name: account
    description: Either authentication mode
  - name: recovery
    description: Password reset and email verification
  - name: mfa
    description: TOTP multi-factor authentication
  - name: books
  - name: admin

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    cookieAuth:
      type: apiKey
      in: cookie
      name: session
      description: Named `__Host-session` when served over HTTPS (not in -dev mode).

  parameters:
    CSRFToken:
      name: X-CSRF-Token
      in: header
      required: false
      description: Required for cookie-authenticated POST, PUT and DELETE requests.
      schema: { type: string }
    BookID:
      name: id
      in: path
      required: true
      schema: { type: string }
      example: "1"

  headers:
    RetryAfter:
      description: Seconds until another login attempt is accepted.
      schema: { type: integer }

  requestBodies:
    MFALogin:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [challenge, code]
            properties:
              challenge: { type: string, description: From the 401 mfa_required response }
              code: { type: string, description: A TOTP code or a recovery code }
    Code:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [code]
            properties:
              code: { type: string }

  responses:
    BadRequest:
      description: Malformed request
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Unauthorized:
      description: >-
        Missing or invalid credentials. After a correct password for an
        account with TOTP, the body is {"error": "mfa required",
        "mfa_required": true, "challenge": "...", "expires_at": "..."}:
        complete the login at .../login/mfa.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Forbidden:
      description: Not allowed by policy, missing CSRF token, or a cross-origin request
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    TooManyRequests:
      description: Too many failed attempts
      headers:
        Retry-After: { $ref: '#/components/headers/RetryAfter' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }

  schemas:
    Error:
      type: object
      properties:
        error: { type: string, example: unauthorized }
      required: [error]

    LoginRequest:
      type: object
      properties:
        provider:
          type: string
          enum: [password, google]
          example: password
        params:
          type: object
          additionalProperties: { type: string }
          description: |
            `password`: `username`, `password`.
            `google`: `id_token` (only when GOOGLE_OAUTH_CLIENTID is configured).
      required: [provider, params]

    RegisterRequest:
      type: object
      properties:
        username: { type: string, example: alice@example.com }
        password: { type: string, minLength: 12, example: alice-long-password }
        invite: { type: string, description: Invite token (required unless sign-up is open) }
      required: [username, password]

    RefreshRequest:
      type: object
      properties:
        refresh_token: { type: string }
      required: [refresh_token]

    Subject:
      type: object
      properties:
        id: { type: string }
        roles: { type: array, items: { type: string } }
        attrs: { type: object, additionalProperties: { type: string } }
      required: [id]

    SessionInfo:
      type: object
      properties:
        id: { type: string, description: Public session ID }
        subject_id: { type: string }
        mode: { type: string, enum: [cookie, bearer] }
        created_at: { type: string, format: date-time }
        last_used_at: { type: string, format: date-time }
        expires_at: { type: string, format: date-time }
        ip: { type: string }
        user_agent: { type: string }
        provider: { type: string }
        mfa: { type: boolean, description: Started with a second factor }

    SessionListItem:
      allOf:
        - $ref: '#/components/schemas/SessionInfo'
        - type: object
          properties:
            current: { type: boolean }

    BearerLoginResult:
      type: object
      properties:
        mode: { type: string, enum: [bearer] }
        access_token: { type: string }
        refresh_token: { type: string }
        subject: { $ref: '#/components/schemas/Subject' }
        session: { $ref: '#/components/schemas/SessionInfo' }

    CookieSession:
      type: object
      properties:
        subject: { $ref: '#/components/schemas/Subject' }
        session: { $ref: '#/components/schemas/SessionInfo' }
        csrf_token: { type: string }

    TokenPair:
      type: object
      properties:
        access_token: { type: string }
        refresh_token: { type: string }

    InviteRequest:
      type: object
      properties:
        email: { type: string, description: Optional; binds the invite to this email }
        roles:
          type: array
          items: { type: string, enum: [reader, editor] }
          default: [reader]

    Invite:
      type: object
      properties:
        id: { type: string }
        token: { type: string, description: Shown once; deliver it to the invitee }
        expires_at: { type: string, format: date-time }

    Book:
      type: object
      properties:
        id: { type: string, readOnly: true }
        title: { type: string }
        author: { type: string }
      required: [title, author]

paths:
  # ---------------------------------------------------------------- bearer
  /api/login:
    post:
      tags: [bearer]
      summary: Log in and receive tokens
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginRequest' }
            example: { provider: password, params: { username: admin@gmail.com, password: p@$$w0rd1 } }
      responses:
        '200':
          description: Logged in
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BearerLoginResult' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /api/register:
    post:
      tags: [bearer]
      summary: Sign up and receive tokens
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RegisterRequest' }
      responses:
        '201':
          description: Signed up
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BearerLoginResult' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { description: Username taken }

  /api/refresh:
    post:
      tags: [bearer]
      summary: Rotate the refresh token and get a new access token
      description: The old refresh token stops working. Presenting it again revokes the whole session.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RefreshRequest' }
      responses:
        '200':
          description: New token pair
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TokenPair' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/logout:
    post:
      tags: [bearer]
      summary: End the session that owns a refresh token
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RefreshRequest' }
      responses:
        '200': { description: Logged out }
        '400': { $ref: '#/components/responses/BadRequest' }

  # ---------------------------------------------------------------- cookie
  /api/session/login:
    post:
      tags: [cookie]
      summary: Log in with a session cookie
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginRequest' }
      responses:
        '200':
          description: Logged in; the session cookie is set
          headers:
            Set-Cookie: { schema: { type: string }, description: HttpOnly session cookie }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CookieSession' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /api/session/register:
    post:
      tags: [cookie]
      summary: Sign up with a session cookie
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RegisterRequest' }
      responses:
        '201':
          description: Signed up; the session cookie is set
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CookieSession' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/session:
    get:
      tags: [cookie]
      summary: Current session and a CSRF token
      security: [{ cookieAuth: [] }]
      responses:
        '200':
          description: Session
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CookieSession' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/session/logout:
    post:
      tags: [cookie]
      summary: Log out and clear the cookie
      security: [{ cookieAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/CSRFToken' }]
      responses:
        '200': { description: Logged out }
        '403': { $ref: '#/components/responses/Forbidden' }

  # --------------------------------------------------------------- account
  /api/me:
    get:
      tags: [account]
      summary: The authenticated subject
      security: [{ cookieAuth: [] }, { bearerAuth: [] }]
      responses:
        '200':
          description: Subject
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Subject' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/sessions:
    get:
      tags: [account]
      summary: List my active sessions
      security: [{ cookieAuth: [] }, { bearerAuth: [] }]
      responses:
        '200':
          description: Sessions
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/SessionListItem' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/sessions/{id}:
    delete:
      tags: [account]
      summary: Revoke one of my sessions
      security: [{ cookieAuth: [] }, { bearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - { $ref: '#/components/parameters/CSRFToken' }
      responses:
        '204': { description: Revoked }
        '404': { description: No such session of mine }

  /api/sessions/revoke-others:
    post:
      tags: [account]
      summary: Log out everywhere else
      security: [{ cookieAuth: [] }, { bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/CSRFToken' }]
      responses:
        '200':
          description: Number of sessions revoked
          content:
            application/json:
              schema:
                type: object
                properties:
                  revoked: { type: integer }

  /api/identities:
    post:
      tags: [account]
      summary: Link another identity (for example Google) to my account
      security: [{ cookieAuth: [] }, { bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/CSRFToken' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginRequest' }
      responses:
        '204': { description: Linked }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { description: The identity belongs to another account }

  # -------------------------------------------------------------- recovery
  /api/password/forgot:
    post:
      tags: [recovery]
      summary: Request a password-reset link
      description: >-
        Always 202 with the same body, whether or not the account exists. The
        link's token is delivered to the login's address (the demo logs it in
        -dev). Throttled per login and per IP.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username]
              properties:
                username: { type: string }
      responses:
        '202': { description: Accepted }
        '429': { description: Too many requests; see Retry-After }

  /api/password/reset:
    post:
      tags: [recovery]
      summary: Set a new password with a reset token
      description: Signs the account out of every session.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, password]
              properties:
                token: { type: string }
                password: { type: string }
      responses:
        '204': { description: Password changed }
        '400': { description: Invalid or expired token, or the password breaks the policy }

  /api/email/verification:
    post:
      tags: [recovery]
      summary: Send a verification link to one of my addresses
      security: [{ cookieAuth: [] }, { bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/CSRFToken' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: { type: string }
      responses:
        '202': { description: Sent }
        '400': { description: Not an email address }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/email/verify:
    post:
      tags: [recovery]
      summary: Verify an address with a verification token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties:
                token: { type: string }
      responses:
        '200':
          description: The verified address
          content:
            application/json:
              schema:
                type: object
                properties:
                  subject_id: { type: string }
                  email: { type: string }
        '400': { description: Invalid or expired token }

  # ------------------------------------------------------------------- mfa
  /api/login/mfa:
    post:
      tags: [mfa, bearer]
      summary: Complete a login that answered 401 mfa_required (bearer tokens)
      requestBody: { $ref: '#/components/requestBodies/MFALogin' }
      responses:
        '200': { description: Tokens, as for /api/login }
        '401': { description: Invalid code or expired challenge }
        '429': { description: Too many wrong codes; see Retry-After }

  /api/session/login/mfa:
    post:
      tags: [mfa, cookie]
      summary: Complete a login that answered 401 mfa_required (cookie session)
      requestBody: { $ref: '#/components/requestBodies/MFALogin' }
      responses:
        '200': { description: Session, as for /api/session/login; session.mfa is true }
        '401': { description: Invalid code or expired challenge }
        '429': { description: Too many wrong codes; see Retry-After }

  /api/mfa/totp:
    post:
      tags: [mfa]
      summary: Start TOTP enrollment
      security: [{ cookieAuth: [] }, { bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/CSRFToken' }]
      responses:
        '200':
          description: The secret, once (base32 and otpauth URI for a QR code)
          content:
            application/json:
              schema:
                type: object
                properties:
                  secret: { type: string }
                  uri: { type: string }
        '409': { description: Already enrolled }
    delete:
      tags: [mfa]
      summary: Turn TOTP off (needs a fresh code)
      security: [{ cookieAuth: [] }, { bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/CSRFToken' }]
      requestBody: { $ref: '#/components/requestBodies/Code' }
      responses:
        '204': { description: Disabled }
        '401': { description: Invalid code }

  /api/mfa/totp/confirm:
    post:
      tags: [mfa]
      summary: Confirm enrollment with a first code
      security: [{ cookieAuth: [] }, { bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/CSRFToken' }]
      requestBody: { $ref: '#/components/requestBodies/Code' }
      responses:
        '200':
          description: Recovery codes, shown once
          content:
            application/json:
              schema:
                type: object
                properties:
                  recovery_codes: { type: array, items: { type: string } }
        '401': { description: Invalid code }

  # ----------------------------------------------------------------- books
  /api/books:
    get:
      tags: [books]
      summary: List books (read on book)
      security: [{ cookieAuth: [] }, { bearerAuth: [] }]
      responses:
        '200':
          description: Books
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Book' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [books]
      summary: Create a book (write on book)
      security: [{ cookieAuth: [] }, { bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/CSRFToken' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Book' }
            example: { title: Book B, author: Mary Shelley }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Book' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/books/{id}:
    get:
      tags: [books]
      summary: Get a book (read on book)
      security: [{ cookieAuth: [] }, { bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/BookID' }]
      responses:
        '200':
          description: Book
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Book' }
        '404': { description: Not found }
    put:
      tags: [books]
      summary: Update a book (write on book)
      security: [{ cookieAuth: [] }, { bearerAuth: [] }]
      parameters:
        - { $ref: '#/components/parameters/BookID' }
        - { $ref: '#/components/parameters/CSRFToken' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Book' }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Book' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { description: Not found }
    delete:
      tags: [books]
      summary: Delete a book (write on book)
      security: [{ cookieAuth: [] }, { bearerAuth: [] }]
      parameters:
        - { $ref: '#/components/parameters/BookID' }
        - { $ref: '#/components/parameters/CSRFToken' }
      responses:
        '204': { description: Deleted }
        '403': { $ref: '#/components/responses/Forbidden' }

  # ----------------------------------------------------------------- admin
  /api/invites:
    post:
      tags: [admin]
      summary: Create an invite (create on invite — admins)
      security: [{ cookieAuth: [] }, { bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/CSRFToken' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/InviteRequest' }
      responses:
        '201':
          description: Invite; the token is shown only once
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Invite' }
        '400': { description: Invites may grant reader or editor only }
        '403': { $ref: '#/components/responses/Forbidden' }

  /admin/keys/rotate:
    post:
      tags: [admin]
      summary: Rotate the access-token signing key (rotate on signing_key — admins)
      description: Tokens signed with the previous key keep verifying. Key material is never returned.
      security: [{ cookieAuth: [] }, { bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/CSRFToken' }]
      responses:
        '200':
          description: Rotated
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: rotated }
                  active_key_id: { type: string }
                  previous_key_id: { type: string }
        '403': { $ref: '#/components/responses/Forbidden' }
