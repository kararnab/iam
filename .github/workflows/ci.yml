name: ci

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: test (go ${{ matrix.go }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        go: ["1.26.x", "1.27.x"]
    # Integration tests (pgstore, redisstore, demo end-to-end on PostgreSQL)
    # run against these; locally they are skipped unless the variables are set.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: iamtest
          POSTGRES_DB: iamtest
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s --health-timeout 5s --health-retries 30
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 2s --health-timeout 5s --health-retries 30
    env:
      IAM_TEST_POSTGRES_DSN: postgres://postgres:iamtest@localhost:5432/iamtest?sslmode=disable
      IAM_TEST_REDIS_ADDR: localhost:6379
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
          cache-dependency-path: "**/go.sum"
      - name: vet and test every module
        run: ./scripts/each-module.sh sh -c 'go vet ./... && go test -race ./...'

  golangci-lint:
    name: golangci-lint (${{ matrix.module }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module: [".", oidc, paseto, pgstore, redisstore, prometheus, webauthn, examples/demo]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.x"
          cache-dependency-path: "**/go.sum"
      # Includes gofmt, goimports, staticcheck, gosec and more; see .golangci.yml.
      - uses: golangci/golangci-lint-action@v8
        with:
          version: v2.14.0
          working-directory: ${{ matrix.module }}

  govulncheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.x"
          cache-dependency-path: "**/go.sum"
      - name: govulncheck
        run: ./scripts/each-module.sh go run golang.org/x/vuln/cmd/govulncheck@latest ./...
