name: ci

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: test (go ${{ matrix.go }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        go: ["1.26.x", "1.27.x"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
          cache-dependency-path: "**/go.sum"
      - name: vet and test every module
        run: ./scripts/each-module.sh sh -c 'go vet ./... && go test -race ./...'

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.x"
          cache-dependency-path: "**/go.sum"
      - name: gofmt
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - name: staticcheck
        run: ./scripts/each-module.sh go run honnef.co/go/tools/cmd/staticcheck@latest ./...
      - name: govulncheck
        run: ./scripts/each-module.sh go run golang.org/x/vuln/cmd/govulncheck@latest ./...
